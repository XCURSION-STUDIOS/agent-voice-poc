[project]
name = "jarvis-voice-backend"
version = "0.1.0"
description = "Provider-configurable Pipecat voice assistant POC"
requires-python = ">=3.12"
dependencies = [
  "pipecat-ai[runner,webrtc,deepgram,silero]>=0.0.105",
  "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8"]

[tool.ruff]
line-length = 100
target-version = "py312"
